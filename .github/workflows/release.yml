name: Release

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest

    # NuGet Trusted Publishing (OIDC): no API key secret is used.
    # The matching rule must be configured on nuget.org:
    # package WaitingDictionary -> Manage -> Trusted Publishing with GitHub owner/repo/workflow "release.yml".
    # If the rule pins an environment, uncomment the `environment` below to match it.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Pack
        run: dotnet pack waiting-dictionary --configuration Release -o "./packages"
      - name: Publish NuGet
        run: dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
